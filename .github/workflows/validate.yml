name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb  # master @ 2026-09-05

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main @ 2026-09-05
        with:
          category: integration
          # The domain is not (yet) registered in the home-assistant/brands
          # repository, which is only required for the default HACS store.
          # Skip that single check for this custom integration.
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Home Assistant 2026.6+ requires Python >= 3.14.2.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Black
        run: black --check custom_components/hoymiles_solarpv scripts tests
      - name: isort
        run: isort --check-only custom_components/hoymiles_solarpv scripts tests
      - name: flake8
        run: flake8 custom_components/hoymiles_solarpv scripts tests
      - name: mypy
        run: mypy
      - name: Ruff
        run: ruff check custom_components/hoymiles_solarpv tests
      - name: Run pytest
        run: pytest
