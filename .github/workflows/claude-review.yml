name: Claude review

# Runs Claude Code on a pull request when someone mentions @claude in a PR
# comment, an inline review comment or a review, e.g. "@claude review this".
#
# Authenticates with a Claude Pro/Max subscription: generate the token with
# `claude setup-token` and store it as the CLAUDE_CODE_OAUTH_TOKEN repository
# secret. Usage counts against that subscription's limits.
#
# The action itself only runs for users with write access to the repository,
# so @claude mentions from anyone else on this public repo are ignored.
#
# GitHub runs comment-triggered workflows from the default branch, so this
# workflow only reacts to @claude once it has been merged into main.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per PR at a time; a new @claude mention waits for the previous one.
concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # issue_comment also fires for plain issues; only react on pull requests.
    if: >-
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # Review only: Claude can read the code and comment, but not push commits.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read  # Lets Claude read the PR's CI results.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea  # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job's own short-lived token, so no GitHub App needs to be
          # installed; comments are posted as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "This repository is a Home Assistant custom integration (HACS) for Hoymiles solar microinverters, under custom_components/hoymiles_solarpv. When asked to review, focus on correctness bugs, Home Assistant API misuse or deprecations, and missing test coverage. Put findings on specific lines as inline comments and give a short summary in the tracking comment. Skip style nits that black, isort, flake8 and mypy already enforce."
